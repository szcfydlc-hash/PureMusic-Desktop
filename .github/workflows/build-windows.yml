name: Build PureMusic Windows (MSI + Portable ZIP)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Windows Distributable & MSI Installer
        run: gradle createDistributable packageMsi --stacktrace

      - name: Zip Portable Windows App
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/release-artifacts | Out-Null
          $appDir = "build/compose/binaries/main/app/PureMusic"
          if (Test-Path $appDir) {
            Compress-Archive -Path "$appDir/*" -DestinationPath "build/release-artifacts/PureMusic-Windows-Portable-v1.0.0.zip" -Force
          }
          Get-ChildItem -Path "build/compose/binaries/main/msi" -Filter "*.msi" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "build/release-artifacts/PureMusic-Windows-Setup-v1.0.0.msi" -Force
          }
          Get-ChildItem -Path "build/release-artifacts"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PureMusic-Windows-v1.0.0
          path: build/release-artifacts/*
